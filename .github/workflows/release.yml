name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/build-release-assets.sh'
      - 'Dockerfile'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:
    inputs:
      version:
        description: Existing tag to release, for example v1.0.0
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-artifacts:
    name: Build release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="pr-${{ github.event.pull_request.number }}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Build archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: ./scripts/build-release-assets.sh

      - name: Show dry-run artifacts
        if: github.event_name == 'pull_request'
        run: |
          ls -lah dist
          cat dist/checksums.txt

      - name: Upload release artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  publish-image:
    name: Publish GHCR image
    runs-on: ubuntu-latest
    needs: build-artifacts
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Determine build metadata
        id: build
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="$GITHUB_REF_NAME"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ steps.build.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ !contains(steps.build.outputs.version, '-') }}

      - name: Build and push image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            COMMIT=${{ steps.build.outputs.commit }}
            BUILD_DATE=${{ steps.build.outputs.build_date }}

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-artifacts
      - publish-image
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="$GITHUB_REF_NAME"
          fi
          git fetch --tags --force
          git rev-parse -q --verify "refs/tags/${version}" >/dev/null
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-dist
          path: dist

      - name: Create release notes
        run: |
          cat > release-notes.md <<EOF
          Release ${{ steps.version.outputs.version }}

          Artifacts include server, migration, and SDE import binaries for Linux, macOS, and Windows.
          Verify downloads with checksums.txt.

          Docker image:

          ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" dist/* \
            --verify-tag \
            --title "${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md
