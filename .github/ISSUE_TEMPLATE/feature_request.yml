name: Feature request
description: Suggest a useful improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need or workflow would this solve?
      placeholder: I am building ... and need ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the API, behavior, or UX you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other designs did you consider?
  - type: checkboxes
    id: surface
    attributes:
      label: Affected surfaces
      options:
        - label: REST API
        - label: GraphQL API
        - label: Go SDK
        - label: Admin UI
        - label: Docker/deployment
        - label: Documentation
