openapi: 3.0.3
info:
  title: EVE SDE Server API
  description: |
    Modern REST API for EVE Online Static Data Export.

    Provides access to 25,000+ EVE items with full-text search capabilities.
    Data is automatically synchronized with CCP's official SDE releases.
  version: 1.0.0
  contact:
    name: EVE SDE Server
    url: https://github.com/ilyaux/eve-sde-server
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.eve-sde.example.com
    description: Production server

tags:
  - name: Health
    description: Health check endpoints
  - name: Items
    description: EVE item operations
  - name: Search
    description: Full-text search
  - name: Taxonomy
    description: EVE inventory categories and groups
  - name: SDE Versions
    description: SDE version history and diff endpoints
  - name: ESI Proxy
    description: Cached proxy endpoints for selected ESI data
  - name: Admin
    description: Admin-only key and update management

paths:
  /health:
    get:
      summary: Health check
      description: Returns the health status of the server
      tags:
        - Health
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK

  /api/v1/items:
    get:
      summary: List items
      description: Returns a paginated list of EVE items
      tags:
        - Items
      parameters:
        - name: limit
          in: query
          description: Maximum number of items to return
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: Number of items to skip
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Item'
                  meta:
                    type: object
                    properties:
                      count:
                        type: integer
                        example: 50
                      total:
                        type: integer
                        example: 25000
                      limit:
                        type: integer
                        example: 50
                      offset:
                        type: integer
                        example: 0

  /api/v1/items/{id}:
    get:
      summary: Get item by ID
      description: Returns a single EVE item by its type ID
      tags:
        - Items
      parameters:
        - name: id
          in: path
          required: true
          description: The item's type ID
          schema:
            type: integer
            example: 34
      responses:
        '200':
          description: Item found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '404':
          description: Item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/search:
    get:
      summary: Search items
      description: Full-text search across item names and descriptions using SQLite FTS5
      tags:
        - Search
      parameters:
        - name: q
          in: query
          required: true
          description: Search query
          schema:
            type: string
            example: frigate
        - name: limit
          in: query
          description: Maximum number of search results to return
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: Number of search results to skip
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Item'
                  meta:
                    type: object
                    properties:
                      count:
                        type: integer
                        example: 42
                      total:
                        type: integer
                        example: 42
                      limit:
                        type: integer
                        example: 50
                      offset:
                        type: integer
                        example: 0
        '400':
          description: Missing query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/categories:
    get:
      summary: List categories
      description: Returns a paginated list of EVE inventory categories
      tags:
        - Taxonomy
      parameters:
        - name: limit
          in: query
          description: Maximum number of categories to return
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          description: Number of categories to skip
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'

  /api/v1/categories/{id}:
    get:
      summary: Get category by ID
      description: Returns a single EVE inventory category
      tags:
        - Taxonomy
      parameters:
        - name: id
          in: path
          required: true
          description: Category ID
          schema:
            type: integer
            example: 4
      responses:
        '200':
          description: Category found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/categories/{id}/groups:
    get:
      summary: List groups in a category
      description: Returns a paginated list of groups for one category
      tags:
        - Taxonomy
      parameters:
        - name: id
          in: path
          required: true
          description: Category ID
          schema:
            type: integer
            example: 6
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 500
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Group list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupList'

  /api/v1/groups:
    get:
      summary: List groups
      description: Returns a paginated list of EVE inventory groups
      tags:
        - Taxonomy
      parameters:
        - name: category_id
          in: query
          description: Optional category filter
          schema:
            type: integer
            example: 6
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 500
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Group list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupList'

  /api/v1/groups/{id}:
    get:
      summary: Get group by ID
      description: Returns a single EVE inventory group
      tags:
        - Taxonomy
      parameters:
        - name: id
          in: path
          required: true
          description: Group ID
          schema:
            type: integer
            example: 18
      responses:
        '200':
          description: Group found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/diff:
    get:
      summary: Compare two SDE versions
      description: Returns a diff placeholder until historical SDE snapshots are available
      tags:
        - SDE Versions
      parameters:
        - name: from
          in: query
          required: true
          description: Source SDE version identifier
          schema:
            type: string
            example: "20250101"
        - name: to
          in: query
          required: true
          description: Target SDE version identifier
          schema:
            type: string
            example: "20250201"
      responses:
        '200':
          description: Diff response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiffResponse'
        '400':
          description: Missing from or to parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/changelog:
    get:
      summary: List recent SDE imports
      description: Returns recent SDE import history, or the current item count when no import history exists
      tags:
        - SDE Versions
      responses:
        '200':
          description: Changelog response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangelogResponse'

  /api/esi/types/{id}:
    get:
      summary: Get ESI type information
      description: Fetches type information from ESI with server-side caching
      tags:
        - ESI Proxy
      parameters:
        - name: id
          in: path
          required: true
          description: EVE type ID
          schema:
            type: integer
            example: 34
      responses:
        '200':
          description: ESI type information
          headers:
            X-Cache:
              description: Whether the response was served from cache
              schema:
                type: string
                enum:
                  - HIT
                  - MISS
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid type ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: ESI request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/esi/markets/prices:
    get:
      summary: Get ESI market prices
      description: Fetches current market prices from ESI with server-side caching
      tags:
        - ESI Proxy
      responses:
        '200':
          description: ESI market prices
          headers:
            X-Cache:
              description: Whether the response was served from cache
              schema:
                type: string
                enum:
                  - HIT
                  - MISS
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '502':
          description: ESI request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/esi/markets/{regionID}/history/{typeID}:
    get:
      summary: Get ESI market history
      description: Fetches market history for a region and type from ESI with server-side caching
      tags:
        - ESI Proxy
      parameters:
        - name: regionID
          in: path
          required: true
          description: EVE region ID
          schema:
            type: integer
            example: 10000002
        - name: typeID
          in: path
          required: true
          description: EVE type ID
          schema:
            type: integer
            example: 34
      responses:
        '200':
          description: ESI market history
          headers:
            X-Cache:
              description: Whether the response was served from cache
              schema:
                type: string
                enum:
                  - HIT
                  - MISS
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '400':
          description: Invalid region or type ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: ESI request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/esi/cache/clear:
    post:
      summary: Clear ESI proxy cache
      description: Clears the in-memory ESI proxy cache. Requires API-key auth when AUTH_ENABLED=true.
      tags:
        - ESI Proxy
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Cache cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ESICacheClearResponse'
        '401':
          description: Missing or invalid API key when authentication is enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/stats:
    get:
      summary: Get admin statistics
      tags:
        - Admin
      security:
        - AdminBasicAuth: []
      responses:
        '200':
          description: Server statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStats'
        '401':
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/keys:
    get:
      summary: List API keys
      description: Lists key metadata and masked previews. Raw API keys are never returned here.
      tags:
        - Admin
      security:
        - AdminBasicAuth: []
      responses:
        '200':
          description: API key metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminAPIKey'
        '401':
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create API key
      description: Creates an API key and returns the raw key once
      tags:
        - Admin
      security:
        - AdminBasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIKeyRequest'
      responses:
        '201':
          description: API key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAPIKeyResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/keys/{id}:
    delete:
      summary: Revoke API key
      tags:
        - Admin
      security:
        - AdminBasicAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: API key database ID
          schema:
            type: integer
      responses:
        '200':
          description: API key revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeAPIKeyResponse'
        '400':
          description: Invalid key ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/sde/update:
    post:
      summary: Trigger SDE update
      tags:
        - Admin
      security:
        - AdminBasicAuth: []
      responses:
        '200':
          description: Update started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerUpdateResponse'
        '401':
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/sde/status:
    get:
      summary: Get SDE scheduler status
      tags:
        - Admin
      security:
        - AdminBasicAuth: []
      responses:
        '200':
          description: Scheduler status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerStatus'
        '401':
          description: Missing or invalid admin credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: API key generated from the admin API. Required for protected API routes when AUTH_ENABLED=true.
    AdminBasicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Auth credentials from ADMIN_USERNAME and ADMIN_PASSWORD.

  schemas:
    Item:
      type: object
      properties:
        type_id:
          type: integer
          description: Unique item identifier
          example: 34
        name:
          type: string
          description: Item name
          example: Tritanium
        description:
          type: string
          description: Item description
          example: The main building block in space structures...
        volume:
          type: number
          format: float
          description: Item volume in m3
          example: 0.01
        group_id:
          type: integer
          description: EVE inventory group identifier
          example: 18
        category_id:
          type: integer
          description: EVE inventory category identifier
          example: 4
      required:
        - type_id
        - name

    Category:
      type: object
      properties:
        category_id:
          type: integer
          example: 4
        name:
          type: string
          example: Material
        published:
          type: boolean
          example: true
      required:
        - category_id
        - name

    Group:
      type: object
      properties:
        group_id:
          type: integer
          example: 18
        category_id:
          type: integer
          example: 4
        name:
          type: string
          example: Mineral
        published:
          type: boolean
          example: true
      required:
        - group_id
        - category_id
        - name

    PageMeta:
      type: object
      properties:
        count:
          type: integer
          example: 50
        total:
          type: integer
          example: 25000
        limit:
          type: integer
          example: 50
        offset:
          type: integer
          example: 0

    CategoryList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        meta:
          $ref: '#/components/schemas/PageMeta'

    GroupList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Group'
        meta:
          $ref: '#/components/schemas/PageMeta'

    ItemChange:
      type: object
      properties:
        type_id:
          type: integer
          example: 34
        name:
          type: string
          example: Tritanium
        change_type:
          type: string
          enum:
            - added
            - removed
            - modified
          example: modified
        old_value:
          type: string
          example: "0.01"
        new_value:
          type: string
          example: "0.02"
        field_changed:
          type: string
          example: volume

    DiffSummary:
      type: object
      properties:
        added:
          type: integer
          example: 0
        removed:
          type: integer
          example: 0
        modified:
          type: integer
          example: 0

    DiffResponse:
      type: object
      properties:
        from_version:
          type: string
          example: "20250101"
        to_version:
          type: string
          example: "20250201"
        changes:
          type: array
          items:
            $ref: '#/components/schemas/ItemChange'
        summary:
          $ref: '#/components/schemas/DiffSummary'
        note:
          type: string

    SDEVersion:
      type: object
      properties:
        version:
          type: string
          example: current
        imported_at:
          type: string
          example: unknown
        item_count:
          type: integer
          example: 25000

    ChangelogResponse:
      type: object
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/SDEVersion'
        count:
          type: integer
          example: 1
        note:
          type: string

    AdminStats:
      type: object
      properties:
        total_keys:
          type: integer
          example: 3
        active_keys:
          type: integer
          example: 2
        total_items:
          type: integer
          example: 25000
        status:
          type: string
          example: healthy
        timestamp:
          type: integer
          format: int64
          example: 1760000000

    AdminAPIKey:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        key:
          type: string
          description: Masked key preview, not the raw key
          example: sha256_a...1234
        key_preview:
          type: string
          description: Masked key preview, not the raw key
          example: sha256_a...1234
        name:
          type: string
          example: production-app
        rate_limit:
          type: integer
          example: 60
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        active:
          type: boolean
          example: true

    CreateAPIKeyRequest:
      type: object
      properties:
        name:
          type: string
          example: production-app
        rate_limit:
          type: integer
          default: 60
          example: 120
        expires_at:
          type: string
          format: date-time
          nullable: true
      required:
        - name

    CreateAPIKeyResponse:
      type: object
      properties:
        key:
          type: string
          description: Raw API key. Store it immediately; it is only returned once.
          example: esk_0123456789abcdef
        name:
          type: string
          example: production-app
        rate_limit:
          type: integer
          example: 120
        created_at:
          type: string
          format: date-time

    RevokeAPIKeyResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: key revoked

    TriggerUpdateResponse:
      type: object
      properties:
        status:
          type: string
          example: started
        message:
          type: string
          example: SDE update has been triggered in the background

    SchedulerStatus:
      type: object
      properties:
        last_check:
          type: string
          format: date-time
          nullable: true
        message:
          type: string
          example: No updates have been performed yet

    ESICacheClearResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        cleared:
          type: integer
          example: 4

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: Item not found
